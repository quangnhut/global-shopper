# Production: the code and dependencies are baked into the image, nothing is mounted from the repo.
# Start with: docker compose --env-file .env.production up -d --build
# For localhost development use docker-compose-dev.yml.
name: shopper-prod

x-app: &app
  image: shopper-app:prod
  restart: unless-stopped
  volumes:
    - ./.env.production:/var/www/html/workbench/.env:ro
    - uploads:/var/www/html/vendor/orchestra/testbench-core/laravel/storage/app/public/uploads

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      # Local interface only: put a reverse proxy that terminates TLS in front of it.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Publishes scheduled posts and empties the trash.
  scheduler:
    <<: *app
    # Reuses the image built by the app service.
    pull_policy: never
    command: ["vendor/bin/testbench", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shopper}
      MYSQL_USER: ${DB_USERNAME:-shopper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  uploads:
