# Local development: the repo is mounted into the container, so code changes apply immediately.
# Start with: docker compose -f docker-compose-dev.yml up -d --build
# (or copy .env.example to .env, then plain `docker compose ...` commands use this file).
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: shopper-app
    environment:
      # The built-in server handles one request at a time without this.
      PHP_CLI_SERVER_WORKERS: 8
    volumes:
      - .:/var/www/html
      # Native Linux storage: loading vendor/ through the Windows/macOS bind mount makes every request ~13x slower.
      - vendor:/var/www/html/vendor
    ports:
      - "${APP_PORT:-8088}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shopper}
      MYSQL_USER: ${DB_USERNAME:-shopper}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  vendor:
